apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-01
  template:
    metadata:
      labels:
        app: app-01
    spec:
      containers:
      - name: app-01
        image: joselizagaravito/micro1app:latest
        ports:
        - containerPort: 8090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-02
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-02
  template:
    metadata:
      labels:
        app: app-02
    spec:
      containers:
      - name: app-02
        image: joselizagaravito/micro2app:latest
        ports:
        - containerPort: 8091
